<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Main Fuselage Gradient -->
    <linearGradient id="fuselageGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Wing Left Gradient -->
    <linearGradient id="wingLeftGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Wing Right Gradient -->
    <linearGradient id="wingRightGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Sprint Velocity Trail Gradient -->
    <linearGradient id="trailGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="trailGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="trailGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0"/>
      <stop offset="100%" stop-color="#93c5fd" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Center Thruster Glow -->
    <radialGradient id="thrusterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <!-- Border Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Ambient Glow Behind Plane -->
  <circle cx="280" cy="240" r="140" fill="url(#thrusterGlow)" opacity="0.45"/>

  <!-- Agile Sprint Velocity Acceleration Trails (3 Streamlined Bars) -->
  <path d="M 104 380 L 196 288" stroke="url(#trailGrad1)" stroke-width="16" stroke-linecap="round"/>
  <path d="M 148 424 L 260 312" stroke="url(#trailGrad2)" stroke-width="20" stroke-linecap="round"/>
  <path d="M 216 450 L 300 366" stroke="url(#trailGrad3)" stroke-width="14" stroke-linecap="round"/>

  <!-- Supersonic Pilot Jet Body -->
  <!-- Left Wing -->
  <path d="M 408 104 L 176 276 L 256 296 Z" fill="url(#wingLeftGrad)"/>

  <!-- Right Wing -->
  <path d="M 408 104 L 256 296 L 336 336 Z" fill="url(#wingRightGrad)"/>

  <!-- Center Supersonic Fuselage Spine -->
  <path d="M 408 104 L 256 296 L 274 246 Z" fill="url(#fuselageGrad)"/>

  <!-- Cockpit Highlight Ridge -->
  <path d="M 408 104 L 272 264" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85"/>

  <!-- Thruster Core Accent -->
  <circle cx="256" cy="296" r="10" fill="#38bdf8" filter="url(#glow)"/>
</svg>
